# TestHub 本机 Docker Compose 部署
# 用法：copy .env.docker.example .env → docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: testhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-testhub}
      TZ: ${TIME_ZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - testhub

  redis:
    image: redis:7-alpine
    container_name: testhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - testhub

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    container_name: testhub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/docs/']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - testhub

  qcluster:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    container_name: testhub-qcluster
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    command: ['qcluster']
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testhub

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    container_name: testhub-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    command: ['scheduler']
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testhub

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: testhub-nginx
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testhub

volumes:
  mysql_data:
  redis_data:
  media_data:
  logs_data:

networks:
  testhub:
    driver: bridge
